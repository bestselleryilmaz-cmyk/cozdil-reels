name: render
on:
  workflow_dispatch:
    inputs:
      configs:
        description: "Space-separated config paths (default: every configs/pending/*.json)"
        required: false
        default: ""
permissions:
  contents: write
concurrency:
  group: repo-writes
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - uses: actions/cache@v4
        with:
          path: ~/.cache/cozdil
          key: cozdil-assets-v1
      - run: pip install -q httpx==0.28.1 pillow==11.3.0 kokoro-onnx==0.4.9 soundfile==0.13.1 numpy
      - name: render
        env:
          CONFIGS: ${{ inputs.configs }}
        run: |
          set -e
          LIST="$CONFIGS"
          [ -z "$LIST" ] && LIST=$(ls configs/pending/*.json 2>/dev/null || true)
          [ -z "$LIST" ] && { echo "nothing to render"; exit 0; }
          FAILED=""
          for c in $LIST; do
            echo "::group::$c"
            if python engine/render.py "$c"; then
              mkdir -p configs/done && git mv -f "$c" configs/done/ 2>/dev/null || mv "$c" configs/done/
            else
              FAILED="$FAILED $c"
            fi
            echo "::endgroup::"
          done
          echo "FAILED=$FAILED" >> "$GITHUB_ENV"
      - name: commit
        run: |
          git config user.name "cozdil-bot"
          git config user.email "cozdil-bot@users.noreply.github.com"
          git add -A videos qa configs
          git diff --cached --quiet || git commit -m "render reels"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
          if [ -n "$FAILED" ]; then echo "failed:$FAILED"; exit 1; fi
